name: Build debug APK

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest already includes the Android SDK (ANDROID_HOME is set).

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk IntruderSnap-debug.apk

      - name: Upload debug APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: intrudersnap-debug-apk
          path: IntruderSnap-debug.apk
          if-no-files-found: error

      # A Release gives a direct, phone-friendly download link on the repo's Releases page.
      - name: Publish APK as a GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          name: IntruderSnap debug build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: IntruderSnap-debug.apk
          body: |
            Debug APK for physical-device testing (Milestone 1 feasibility spike).
            Branch: ${{ github.ref_name }} · Commit: ${{ github.sha }}

            Install: download IntruderSnap-debug.apk on the phone and open it
            (allow "Install unknown apps" for the browser when asked), then follow docs/TEST_PLAN.md.
